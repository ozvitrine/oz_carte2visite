name: oz_carte2visite
description: Application mobile de gestion de cartes de visite.
publish_to: "none"
version: 2.1.3+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  drift: ^2.20.0
  drift_flutter: ^0.2.0
  collection: ^1.19.0
  sqlite3_flutter_libs: ^0.5.24
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  flutter_contacts: ^1.1.9+2
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  package_info_plus: ^8.0.0
  qr_flutter: ^4.1.0
  

  google_mobile_ads: ^5.3.1
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_barcode_scanning: ^0.14.1

  file_picker: ^8.1.7
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  pdf: ^3.11.2
  printing: ^5.13.4
  archive: ^3.6.1
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash_logo.png"
  android_12:
    image: "assets/splash_logo.png"
    color: "#FFFFFF"